services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus_market
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_market"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional: the API server in a container. Not started by a plain `docker compose up -d`.
  #   docker compose --profile server up -d --build
  # Settings come from your shell / a `.env` file (see .env.example); everything has a dev default.
  server:
    profiles: ["server"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: jdbc:postgresql://db:5432/campus_market
      DATABASE_USER: campus
      DATABASE_PASSWORD: campus
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      DEV_MODE: ${DEV_MODE:-true}
      ALLOWED_EMAIL_SUFFIXES: ${ALLOWED_EMAIL_SUFFIXES:-.edu}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      UPLOADS_DIR: /data/uploads
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-500}
      APP_DEEP_LINK_BASE: ${APP_DEEP_LINK_BASE:-campusmarket://}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Quad <no-reply@campusmarket.local>}
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
